<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Coding Bet</title>
  <!-- Lien vers la feuille de style externe -->
  <link rel="stylesheet" href="bet.css">
</head>
<body>
  <header>
    <div class="logo">CODING BET</div>
    <nav>
      <ul>
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Compte</a></li>
        <li><a href="#">À propos</a></li>
      </ul>
    </nav>
    <button class="bet-now">BET NOW</button>
  </header>

  <div class="main-content">
    <!-- Section 1 : Paris du jour -->
    <div class="bet-section">
      <h2>Paris du jour</h2>

      <div class="match">
        <div class="teams">PSG vs Marseille</div>
        <div class="odds">
          <div class="odd">
            <button>1.70</button>
            <div class="percentage">45%</div>
          </div>
          <div class="odd">
            <button>3.20</button>
            <div class="percentage">30%</div>
          </div>
          <div class="odd">
            <button>4.50</button>
            <div class="percentage">25%</div>
          </div>
        </div>
      </div>

      <div class="match">
        <div class="teams">Real Madrid vs FC Barcelone</div>
        <div class="odds">
          <div class="odd">
            <button>2.10</button>
            <div class="percentage">40%</div>
          </div>
          <div class="odd">
            <button>3.00</button>
            <div class="percentage">35%</div>
          </div>
          <div class="odd">
            <button>3.90</button>
            <div class="percentage">25%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Section 2 : Champions League -->
    <div class="bet-section">
      <h2>Champions League</h2>

      <div class="match">
        <div class="teams">Bayern Munich vs Manchester City</div>
        <div class="odds">
          <div class="odd">
            <button>2.50</button>
            <div class="percentage">35%</div>
          </div>
          <div class="odd">
            <button>3.10</button>
            <div class="percentage">30%</div>
          </div>
          <div class="odd">
            <button>2.80</button>
            <div class="percentage">35%</div>
          </div>
        </div>
      </div>

      <div class="match">
        <div class="teams">Liverpool vs AC Milan</div>
        <div class="odds">
          <div class="odd">
            <button>1.90</button>
            <div class="percentage">40%</div>
          </div>
          <div class="odd">
            <button>3.50</button>
            <div class="percentage">30%</div>
          </div>
          <div class="odd">
            <button>3.10</button>
            <div class="percentage">30%</div>
          </div>
        </div>
      </div>
    </div>
    <!-- Ajoute d'autres sections si besoin -->
  </div>
</body>
</html>
